{% extends "base.html" %}

{% block title %}Upload — AI Document Search{% endblock %}

{% block content %}
<div class="upload-wrapper">

  <h1 class="hero-title">
    Find answers inside your documents. Instantly.
  </h1>

  <p class="hero-subtitle">
    Private. Local. Your documents never leave your machine.
  </p>

  <div class="upload-box">
    <form
      id="upload-form"
      action="{{ url_for('routes.upload') }}"
      method="post"
      enctype="multipart/form-data"
    >
      <label class="upload-dropzone">
        <div class="upload-icons">📄 ⬆️ 🖼️</div>

        <div class="upload-text">Upload documents</div>
        <div class="upload-hint">Drag & drop or click to browse</div>
        <div class="upload-types">PDF, JPG, PNG supported</div>

        <!-- File input -->
        <input
          id="file-input"
          type="file"
          name="file"
          accept=".pdf,.png,.jpg,.jpeg"
          hidden
          required
        />
      </label>
    </form>
  </div>

  <div class="upload-footer">
    <span>💻 Processed locally</span>
    <span>🔒 No cloud upload</span>
    <span>🏛️ Designed for BFSI workflows</span>
  </div>

</div>

<!-- Auto-submit logic -->
<script>
  const fileInput = document.getElementById('file-input');
  const form = document.getElementById('upload-form');

  fileInput.addEventListener('change', () => {
    if (fileInput.files.length > 0) {
      form.submit(); // 🚀 auto upload
    }
  });
</script>
{% endblock %}
